# tmux inside the drill GUI's terminal panel.
#
# The status bar is OFF on purpose. tmux's default is a bright green strip that
# fights everything else in the console, and every field on it - session name,
# window, clock - is already in the panel header or the status bar the GUI draws
# itself. A second status line would be duplicate chrome in the one place the
# learner is trying to read output.
set -g status off

# xterm.js speaks 256 colour and true colour; saying so is what stops kubectl and
# git from falling back to a dimmer palette than the terminal can render.
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# The drill scrolls a lot - rollout output, log tails, a curl loop - and the
# browser's own scrollback is not tmux's.
set -g history-limit 50000

# tmux's default 500ms wait after ESC makes vim feel broken over a websocket.
set -sg escape-time 0

set -g mouse on
setw -g mode-keys vi

# On the off chance a scenario wants a second pane, keep the borders on-palette.
set -g pane-border-style "fg=#2a3140"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#1c222e,fg=#e6e6e6"

# Run the shell as a LOGIN shell, so /etc/profile and /etc/profile.d are read.
# That is where the prompt and $USER come from - see drill/profile.sh - and tmux's
# default varies by platform, so a working prompt would otherwise depend on which
# machine built the image. Explicit beats lucky.
#
# /bin/sh spelled out rather than ${SHELL:-/bin/sh}: tmux does its OWN expansion of
# ${...} here and has no :- default syntax, so that form is a parse error - and a
# parse error makes tmux discard the WHOLE file, which brings back the green status
# bar this config exists to turn off. Both drill images are Alpine and the account's
# shell is /bin/sh, so there is nothing to interpolate anyway.
set -g default-shell /bin/sh
set -g default-command "/bin/sh -l"
